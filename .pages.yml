        label: "11/20 금 — 런던 도착"
        type: file
        path: details/11-20.md
        format: yaml-frontmatter
        operations:
          delete: false
        fields:
          - name: title
            label: "제목"
            type: string
            required: true
          - name: body
            label: "상세 내용 · 글과 사진을 화면에서 편집"
            type: rich-text
            options:
              format: markdown
              switcher: true
